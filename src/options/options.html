<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Seerr Selection Search — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="card">
      <header>
        <h1>Seerr Selection Search</h1>
        <p class="subtitle">Connect the extension to your Seerr instance.</p>
      </header>

      <form id="config-form">
        <label for="seerr-url">Seerr URL</label>
        <input
          id="seerr-url"
          type="text"
          placeholder="http://192.168.1.10:5055"
          autocomplete="off"
          spellcheck="false"
        />
        <p class="hint">Include the scheme (http:// or https://) and port if non-standard.</p>

        <label for="api-key">API Key</label>
        <input
          id="api-key"
          type="password"
          placeholder="Paste your Seerr API key"
          autocomplete="off"
          spellcheck="false"
        />
        <p class="hint">Find this in Seerr under <strong>Settings → General → API Key</strong>.</p>

        <div class="actions">
          <button type="button" id="test-btn" class="secondary">Test Connection</button>
          <button type="submit" id="save-btn" class="primary">Save</button>
        </div>

        <p id="status-msg" class="status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <footer class="page-footer">
      <p class="version">Version <span id="ext-version"></span></p>
      <p class="credit">
        Made with ❤️ by
        <a href="https://github.com/brewandbytedev" target="_blank" rel="noopener noreferrer"
          >Brew and Byte Development</a
        >
      </p>
    </footer>

    <script type="module" src="options.js"></script>
  </body>
</html>
